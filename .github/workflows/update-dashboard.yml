name: Update SKUSavvy Dashboard Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate dashboard data
        env:
          SKUSAVVY_TOKEN: ${{ secrets.SKUSAVVY_TOKEN }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
          CAVALI_SHOPIFY_STORE_DOMAIN: ${{ secrets.CAVALI_SHOPIFY_STORE_DOMAIN }}
          CAVALI_SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.CAVALI_SHOPIFY_ADMIN_ACCESS_TOKEN }}
          SHOPIFY_API_VERSION: "2026-01"

          # Shopify turnover enabled only for current year
          ENABLE_SHOPIFY_API: "true"
          SHOPIFY_CURRENT_YEAR_ONLY: "true"
          SHOPIFY_MONTHS_BACK: "0"

        run: |
          mkdir -p data
          python scripts/generate_data.py

      - name: Commit dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/dashboard.json data/schema-debug.json
          git add data/cavali_inventory_snapshots.csv 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update dashboard data"

          git pull --rebase origin main
          git push origin main
