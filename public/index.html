<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atletix Horse Sales Report</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
[data-theme=light]{--bg:#f4f5f7;--surface:#fff;--surface2:#eef0f4;--border:#dde0e8;--border2:#c9ceda;--text:#101018;--muted:#72758a;--dim:#9aa0b7;--accent:#6842b8;--accent-bg:rgba(104,66,184,.10);--green:#1a9a56;--green-bg:rgba(26,154,86,.10);--amber:#c47a00;--amber-bg:rgba(196,122,0,.10);--red:#cc3333;--red-bg:rgba(204,51,51,.09)}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Syne,system-ui,sans-serif}.shell{max-width:1360px;margin:0 auto;padding:28px 24px 76px}.hdr{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:20px;margin-bottom:22px}.hdr h1{font-size:27px;margin:0;font-weight:800;letter-spacing:-.04em}.hdr h1 span{color:var(--accent)}.sub{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-top:3px}.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.period-box{border:1px solid var(--border2);border-radius:9px;padding:8px 16px;text-align:center;background:var(--surface)}.period-box .wk{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted)}.period-box .pd{font-size:13px;font-weight:800}.tabs{display:flex;gap:4px;border:1px solid var(--border2);background:var(--surface2);border-radius:9px;padding:3px}.tab{border:none;background:transparent;color:var(--muted);padding:6px 16px;border-radius:6px;font-family:'DM Mono',monospace;font-size:11px;cursor:pointer}.tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 5px rgba(0,0,0,.22)}select,.btn,input,textarea{font:12px 'DM Mono',monospace;border:1px solid var(--border2);border-radius:8px;background:var(--surface);color:var(--text)}select{padding:8px 14px;min-width:230px}.btn{padding:8px 14px;cursor:pointer}.btn-primary{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}.notice,.err{padding:14px 16px;border-radius:10px;margin:18px 0;font-family:'DM Mono',monospace;font-size:12px;line-height:1.65}.notice{background:var(--accent-bg);border:1px solid var(--border2);color:var(--accent)}.err{background:var(--red-bg);border:1px solid var(--red);color:var(--red)}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 26px}.slbl{font-family:'DM Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;font-size:12px;margin:24px 0 10px}.badge-count{display:inline-block;margin-left:8px;border:1px solid var(--border2);border-radius:999px;padding:1px 8px;font-size:10px;color:var(--muted);text-transform:none;letter-spacing:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.review-grid{grid-template-columns:repeat(auto-fit,minmax(245px,1fr));align-items:stretch;gap:16px}.review-grid .card{padding:18px;min-height:142px;display:flex;flex-direction:column;justify-content:space-between}.review-grid .card .val{font-size:clamp(26px,2.05vw,34px);line-height:1.05}.review-grid .card .desc{font-size:11px;line-height:1.4}.review-grid .card.hero{border-width:2px;box-shadow:0 8px 24px rgba(104,66,184,.10)}.card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:16px}.card.good{background:var(--green-bg);border-color:rgba(26,154,86,.25)}.card.warn{background:var(--amber-bg);border-color:rgba(196,122,0,.25)}.card.final{background:var(--accent-bg);border-color:rgba(104,66,184,.28)}.card .lbl{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.card .val{font-size:24px;font-weight:800;margin:7px 0;letter-spacing:-.04em;word-break:normal;overflow-wrap:break-word}.card .desc{font-size:11px;color:var(--dim);line-height:1.45}.wide{grid-column:span 2}.formula-bar{margin:16px 0 6px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.formula-bar .formula-title{font:700 11px 'DM Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.formula-bar .formula-main{font-size:20px;font-weight:800;letter-spacing:-.03em}.formula-bar .formula-note{font:11px 'DM Mono',monospace;color:var(--muted)}.pill{display:inline-flex;border-radius:999px;padding:4px 10px;font:700 10px 'DM Mono',monospace;line-height:1.05;white-space:normal;max-width:130px}.pill.reg{background:var(--green-bg);color:var(--green)}.pill.mkt{background:var(--amber-bg);color:var(--amber)}.pill.req{background:var(--amber-bg);color:var(--amber)}.pill.ret{background:var(--red-bg);color:var(--red)}.source{font:10px 'DM Mono',monospace;color:var(--muted);line-height:1.25;margin-top:5px;max-width:150px}.table-wrap{overflow:auto;border:1px solid var(--border);background:var(--surface);border-radius:12px}.tbl{border-collapse:collapse;min-width:1320px;width:100%}.tbl th{position:sticky;top:0;background:var(--surface2);border-bottom:1px solid var(--border);font:700 10px 'DM Mono',monospace;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;padding:10px;text-align:left;white-space:nowrap}.tbl td{border-bottom:1px solid var(--border);padding:10px;vertical-align:top;font-size:12px}.tbl .r{text-align:right;font-family:'DM Mono',monospace;white-space:nowrap}.money{white-space:nowrap}.email{font:10px 'DM Mono',monospace;color:var(--muted);white-space:nowrap}.muted{color:var(--muted)}.mini{font:10px 'DM Mono',monospace;color:var(--muted);line-height:1.35;margin-top:4px}.row-actions{min-width:250px}.choice{padding:5px 9px;margin:0 3px 5px 0;font-size:10px}.choice.active{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}.ship-input{width:125px;padding:7px 9px}.note-input{width:210px;padding:7px 9px}.manual-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:28px}.manual-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.manual-grid input,.manual-grid textarea{width:100%;padding:9px}.manual-grid textarea{min-height:58px}.empty{padding:42px;text-align:center;color:var(--muted);font-family:'DM Mono',monospace;background:var(--surface);border:1px solid var(--border);border-radius:12px}.footer{margin-top:30px;color:var(--muted);font:11px 'DM Mono',monospace}.loading{text-align:center;padding:80px;font-family:'DM Mono',monospace;color:var(--muted)}

.inventory-panel{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;margin-top:18px}.formula-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin:16px 0;font-size:14px;line-height:1.7}.formula-card b{color:var(--text)}.field-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:10px}.field-chip{border:1px solid var(--border);background:var(--surface2);border-radius:12px;padding:12px;font-size:12px;color:var(--muted)}.field-chip b{display:block;color:var(--text);font:700 11px 'DM Mono',monospace;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}.tabs{max-width:100%;overflow:auto}.tab{white-space:nowrap}
@media(max-width:780px){.shell{padding:20px 14px}.hdr h1{font-size:23px}.ctrl,.tabs,select,.btn{width:100%}.tabs{display:grid;grid-template-columns:repeat(2,1fr)}.tab{padding:7px 6px}.period-box{width:100%}.notice{font-size:11px}.grid,.review-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:13px}.card .lbl{font-size:9px}.card .val{font-size:20px;white-space:normal}.card .desc{display:none}.formula-bar{display:block;padding:14px}.formula-bar .formula-main{font-size:17px;margin:6px 0}.wide{grid-column:1/-1}.tbl,.tbl thead,.tbl tbody,.tbl tr,.tbl td{display:block;min-width:0;width:100%}.tbl thead{display:none}.tbl tr{border-bottom:1px solid var(--border);padding:10px}.tbl td{border:0;padding:6px 0}.tbl td:before{content:attr(data-label);display:block;font:700 9px 'DM Mono',monospace;color:var(--dim);text-transform:uppercase;margin-bottom:2px}.tbl .r{text-align:left}.ship-input,.note-input{width:100%}.row-actions{min-width:0}.table-wrap{overflow:visible}.pill{max-width:100%}}

/* v10 visual polish: wider canvas, cleaner KPIs, no visible formula block */
.shell{max-width:1700px;width:min(96vw,1700px);padding:30px 28px 80px}.hdr{align-items:center}.hdr h1{font-size:clamp(28px,2.3vw,42px)}
.notice,.tools,.slbl,.manual-box,.table-wrap,.footer,.card.wide{max-width:none}.review-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;align-items:stretch}.review-grid .card{min-height:150px;padding:22px 24px;border-radius:18px;justify-content:flex-start;gap:10px}.review-grid .card.hero{border-width:2px;box-shadow:0 10px 26px rgba(104,66,184,.14)}.card .lbl{font-size:11px;line-height:1.25;letter-spacing:.075em}.card .val{font-size:clamp(30px,2.05vw,42px);line-height:.98;white-space:nowrap;word-break:normal;overflow-wrap:normal;letter-spacing:-.055em;max-width:100%}.review-grid .card .val{font-size:clamp(32px,2.35vw,48px)}.card .desc{font-size:12px;line-height:1.45;max-width:95%}.formula-bar{display:none!important}.summary-note{margin:16px 0 4px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 20px;font:12px 'DM Mono',monospace;color:var(--muted);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.summary-note b{color:var(--text)}.loaded-shipping{padding:15px 18px;border-radius:16px;border:1px solid var(--border);background:var(--surface);font-size:13px}.loaded-shipping b{font-weight:800}.loaded-shipping .mini-pill{display:inline-flex;margin:4px 6px 0 0;padding:5px 10px;border-radius:999px;background:var(--accent-bg);color:var(--accent);font:11px 'DM Mono',monospace}.tbl{min-width:1480px}.manual-grid{grid-template-columns:1.1fr 1.2fr .7fr .7fr .8fr .9fr 1.25fr 1.1fr}.manual-box{border-radius:18px;padding:18px 20px}.btn-primary{font-weight:700}
@media(max-width:1450px){.review-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.card .val,.review-grid .card .val{font-size:clamp(28px,2.8vw,40px)}}
@media(max-width:1050px){.shell{width:100%;padding:24px 18px 70px}.review-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.review-grid .card{min-height:122px}.card .val,.review-grid .card .val{font-size:30px}.manual-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.review-grid{grid-template-columns:1fr}.card .val,.review-grid .card .val{font-size:30px}.summary-note{display:block}.manual-grid{grid-template-columns:1fr}}


/* v12 visual cleanup: calmer colors, wider canvas, readable KPI cards */
[data-theme=light]{--bg:#f7f8fb;--surface:#ffffff;--surface2:#f0f2f6;--border:#e0e4ec;--border2:#cfd5df;--text:#151722;--muted:#636a7c;--dim:#8a92a5;--accent:#5f4aa8;--accent-bg:rgba(95,74,168,.08);--green:#24724e;--green-bg:rgba(36,114,78,.08);--amber:#9b6a1f;--amber-bg:rgba(155,106,31,.08);--red:#b94242;--red-bg:rgba(185,66,66,.08)}
[data-theme=dark]{--accent:#b8a7ff;--accent-bg:rgba(184,167,255,.10);--green:#65c892;--green-bg:rgba(101,200,146,.10);--amber:#e0b36b;--amber-bg:rgba(224,179,107,.10)}
.shell{max-width:1680px;width:min(1680px,calc(100vw - 56px));padding:28px 0 80px}.hdr{gap:22px}.ctrl{max-width:1160px}.tabs{background:#f4f5f8;border-color:var(--border);box-shadow:none}.tab{color:#525a6d}.tab.active{box-shadow:0 1px 5px rgba(17,24,39,.14)}.notice{background:#f1effa;color:#3f337b;border-color:#d8d2ee}.loaded-shipping,.manual-box,.table-wrap,.summary-note,.inventory-panel,.formula-card{box-shadow:0 1px 2px rgba(15,23,42,.035)}
.review-grid{grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}.review-grid .card{min-height:132px;padding:20px 22px;border-radius:16px}.card.good{background:#eef8f3;border-color:#c9e8d9}.card.warn{background:#faf4ea;border-color:#ecd9b8}.card.final{background:#f1effa;border-color:#d7d0ef}.card .lbl{color:#5f6678}.card .val,.review-grid .card .val{font-size:clamp(30px,2.05vw,42px);line-height:1.05;letter-spacing:-.045em;white-space:normal;overflow-wrap:normal;word-break:normal}.card .desc{color:#7f8798}.review-grid .card.hero{background:#ece8fb;border-color:#c9bff0}.wide-card{grid-column:span 2}.metric-note{margin:14px 0 4px;padding:15px 18px;border:1px solid var(--border);background:var(--surface);border-radius:14px;font-size:13px;color:var(--muted);line-height:1.55}.metric-note b{color:var(--text)}.formula-card{background:#fff;border-color:#e3e6ee}.field-chip{background:#f8f9fb;border-color:#e2e6ee;color:#687084}.footer{display:none!important}.loading{color:#697086}.table-wrap{border-radius:14px}.tbl th{background:#f1f3f7;color:#7a8193}.tbl td{font-size:12px}.pill{font-size:10px}.summary-note{background:#fff}
@media(min-width:1500px){.review-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.review-grid.review-compact{grid-template-columns:repeat(4,minmax(0,1fr))}.review-grid.metric-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:1050px){.shell{width:100%;padding:24px 18px 70px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);width:100%}.ctrl,select,.btn{width:100%}.review-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.tabs{grid-template-columns:repeat(2,1fr)}.review-grid{grid-template-columns:1fr}.card .val,.review-grid .card .val{font-size:30px}.wide-card{grid-column:1/-1}}

</style>
</head>
<body>
<div class="shell">
  <div class="hdr">
    <div><h1><span>Atletix Horse</span> Sales Report</h1><div class="sub">Atletix reporting: Month, Quarter, H1/H2 Review, and Inventory Metrics</div></div>
    <div class="ctrl"><div class="period-box"><div class="wk">period</div><div class="pd" id="periodLabel">Loading</div></div><div class="tabs"><button class="tab" id="tabMonth" onclick="setMode('month')">By Month</button><button class="tab" id="tabQuarter" onclick="setMode('quarter')">By Quarter</button><button class="tab" id="tabHalf" onclick="setMode('half')">H1/H2 Review</button><button class="tab" id="tabInventory" onclick="setMode('inventory')">Inventory Overview</button><button class="tab" id="tabRotation" onclick="setMode('rotation')">Inventory Rotation</button><button class="tab" id="tabTurnover" onclick="setMode('turnover')">Inventory Turnover</button></div><select id="periodSelect" onchange="loadView()"></select><button class="btn btn-primary" onclick="reloadData()">Refresh</button><button class="btn" onclick="toggleTheme()" id="themeBtn">Dark</button></div>
  </div>
  <div id="main" class="loading">Loading report data...</div>
</div>
<script>
const DATA_URL='data/report.json';
const LS_MODE='atletix_github_mode_v1';
const LS_PERIOD='atletix_github_period_v1';
const LS_REVIEW='atletix_review_choices_v1';
let report=null, mode=localStorage.getItem(LS_MODE)||'half', rows=[];
function money(n){n=Number(n||0);return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function num(n){return Number(n||0).toLocaleString('en-US');}
function esc(s){return String(s==null?'':s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function dateFmt(s){if(!s)return'';const d=new Date(s);return d.toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric'});}
function keyOf(r){return r.manual_id||String(r.order_id||'')+'_'+String(r.product||'')+'_'+String(r.quantity||'');}
function yearOf(r){const d=new Date(r.order_date);return d.getFullYear();}
function monthOf(r){const d=new Date(r.order_date);return d.getMonth()+1;}
function qOf(m){return Math.floor((m-1)/3)+1;}
function halfOf(m){return m<=6?'H1':'H2';}
function periodKeyForRow(r){const y=yearOf(r),m=monthOf(r);return {month:`M:${y}:${m}`,quarter:`Q:${y}:${qOf(m)}`,half:`H:${y}:${halfOf(m)}`};}
function toggleTheme(){const cur=document.documentElement.dataset.theme||'light';const next=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('theme',next);document.getElementById('themeBtn').textContent=next==='dark'?'Light':'Dark';}
(function(){const t=localStorage.getItem('theme')||'light';document.documentElement.dataset.theme=t;})()
async function loadData(cacheBust=false){try{document.getElementById('main').className='loading';document.getElementById('main').textContent='Loading report data...';const res=await fetch(DATA_URL+(cacheBust?'?t='+Date.now():''),{cache:cacheBust?'reload':'default'});if(!res.ok)throw new Error('Could not load data/report.json');report=await res.json();rows=(report.rows||[]).concat(report.manual_defaults||[]);buildPeriodSelect();loadView();}catch(e){document.getElementById('main').className='';document.getElementById('main').innerHTML='<div class="err">'+esc(e.message)+'</div>';}}
function reloadData(){loadData(true);}
function setMode(m){mode=m;localStorage.setItem(LS_MODE,m);buildPeriodSelect();loadView();}
function periodMode(){return (mode==='inventory'||mode==='rotation'||mode==='turnover')?'half':mode;}
function buildPeriodSelect(){['Month','Quarter','Half','Inventory','Rotation','Turnover'].forEach(x=>{const el=document.getElementById('tab'+x);if(el)el.classList.toggle('active',mode===x.toLowerCase());});const sel=document.getElementById('periodSelect');const saved=localStorage.getItem(LS_PERIOD)||'';const pm=periodMode();let opts=[];const seen=new Set();const now=new Date();
 rows.forEach(r=>{if(!r.order_date)return;const y=yearOf(r),m=monthOf(r);if(!y||!m)return;if(pm==='month'){const k=`M:${y}:${m}`;if(!seen.has(k)){seen.add(k);opts.push({k,label:new Date(y,m-1,1).toLocaleString('en-US',{month:'long',year:'numeric'}),sort:y*100+m});}} if(pm==='quarter'){const q=qOf(m),k=`Q:${y}:${q}`;if(!seen.has(k)){seen.add(k);opts.push({k,label:`Q${q} ${y}`,sort:y*10+q});}} if(pm==='half'){const h=halfOf(m),k=`H:${y}:${h}`;if(!seen.has(k)){seen.add(k);opts.push({k,label:`${h} ${y} (${h==='H1'?'Jan - Jun':'Jul - Dec'})`,sort:y*10+(h==='H1'?1:2)});}}});
 if(pm==='half'){const cy=now.getFullYear();['H1','H2'].forEach((h,i)=>{const k=`H:${cy}:${h}`;if(!seen.has(k)){seen.add(k);opts.push({k,label:`${h} ${cy} (${h==='H1'?'Jan - Jun':'Jul - Dec'})`,sort:cy*10+i+1});}})}
 opts.sort((a,b)=>b.sort-a.sort);sel.innerHTML=opts.map(o=>`<option value="${o.k}">${o.label}</option>`).join(''); if(opts.find(o=>o.k===saved)) sel.value=saved; else if(pm==='half'){const h1=`H:${now.getFullYear()}:H1`;sel.value=opts.find(o=>o.k===h1)?.k||opts[0]?.k||'';} else sel.value=opts[0]?.k||'';}
function selectedRows(){const k=document.getElementById('periodSelect').value;localStorage.setItem(LS_PERIOD,k);const pm=periodMode();return rows.filter(r=>{const p=periodKeyForRow(r);return p[pm]===k;});}
function periodLabel(){const sel=document.getElementById('periodSelect');return sel.options[sel.selectedIndex]?.textContent||'-';}
function loadView(){if(!report)return;document.getElementById('periodLabel').textContent=periodLabel().split(' (')[0];if(mode==='half')renderReview(); else if(mode==='inventory')renderInventoryOverview(); else if(mode==='rotation')renderInventoryRotation(); else if(mode==='turnover')renderInventoryTurnover(); else renderStandard();}
function readReview(){try{return JSON.parse(localStorage.getItem(LS_REVIEW)||'{}')}catch(e){return {}}}
function writeReview(v){localStorage.setItem(LS_REVIEW,JSON.stringify(v));}
function stateFor(r){const all=readReview();const k=keyOf(r);if(!all[k]){all[k]={included:r.type!=='Atletix Request'?true:true,countType:r.type==='Atletix Request'?'request':'regular',shipping:Number(r.manual_shipping||0),note:r.note||'',edits:{}};writeReview(all);}return all[k];}
function setRow(k,patch){const all=readReview();all[k]=Object.assign({},all[k]||{},patch);writeReview(all);renderReview();}
function sectionType(r,st){if(!st.included)return 'excluded'; if(st.countType==='request'||r.type==='Atletix Request')return 'request'; if(r.type==='Marketing / Seeded')return 'marketing'; if(r.type==='Credit / Return')return 'return'; return 'regular';}
function calcReview(){const list=selectedRows();const states=list.map(r=>[r,stateFor(r)]);let totalOrders=new Set(), excludedOrders=[], totalUnits=0, excludedUnits=0,totalCogs=0,cogsExcluded=0,shipping=0;states.forEach(([r,st])=>{totalOrders.add(r.order_id);const qty=Number(st.edits?.quantity??r.quantity??0);const unit=Number(st.edits?.unit_cogs??r.unit_cogs??0);const cogs=Math.round(qty*unit*100)/100;totalUnits+=Math.max(qty,0);totalCogs+=cogs;const isRemoved=!st.included||st.countType==='request'||r.type==='Atletix Request';if(isRemoved){excludedUnits+=Math.max(qty,0);cogsExcluded+=cogs;if(!st.included)excludedOrders.push(r.order_id);}if(st.included)shipping+=Number(st.shipping||0);});totalCogs=Math.round(totalCogs*100)/100;cogsExcluded=Math.round(cogsExcluded*100)/100;shipping=Math.round(shipping*100)/100;const netCogs=Math.max(0,Math.round((totalCogs-cogsExcluded)*100)/100);return{list,states,totalOrders:totalOrders.size,totalExcluded:new Set(excludedOrders).size,totalUnits,excludedUnits,totalCogs,originalProductCogs:totalCogs,netCogs,finalCogs:netCogs,cogsExcluded,shipping,invoice:Math.round((netCogs+shipping)*100)/100,excludedOrders:[...new Set(excludedOrders)]};}
function periodBounds(){const k=document.getElementById('periodSelect').value||'';const parts=k.split(':');const y=Number(parts[1]);if(parts[0]==='M'){const m=Number(parts[2]);return{start:new Date(Date.UTC(y,m-1,1)),end:new Date(Date.UTC(y,m,1))};}if(parts[0]==='Q'){const q=Number(parts[2]);const sm=(q-1)*3;return{start:new Date(Date.UTC(y,sm,1)),end:new Date(Date.UTC(y,sm+3,1))};}if(parts[0]==='H'){const h=parts[2];return{start:new Date(Date.UTC(y,h==='H1'?0:6,1)),end:new Date(Date.UTC(y,h==='H1'?6:12,1))};}return{start:new Date(0),end:new Date()};}
function inventoryMetrics(){const cfg=report.config||{};const unit=Number(cfg.unit_cogs||89);const initial=Number(cfg.initial_stock||100);const b=periodBounds();function rowQty(r){return Math.max(Number(r.quantity||0),0)}const beforeUnits=rows.filter(r=>r.order_date&&new Date(r.order_date)<b.start).reduce((s,r)=>s+rowQty(r),0);const periodRows=selectedRows();const unitsSold=periodRows.reduce((s,r)=>s+rowQty(r),0);const opening=Math.max(0,initial-beforeUnits);const ending=Math.max(0,opening-unitsSold);const avgUnits=(opening+ending)/2;const totalCogs=round2(unitsSold*unit);const openingValue=round2(opening*unit);const endingValue=round2(ending*unit);const avgValue=round2(avgUnits*unit);const rotation=avgUnits>0?round2(unitsSold/avgUnits):0;const turnover=avgValue>0?round2(totalCogs/avgValue):0;return{unit,initial,opening,ending,avgUnits,unitsSold,totalCogs,openingValue,endingValue,avgValue,rotation,turnover};}
function metricKpis(m,kind){const mainLabel=kind==='turnover'?'Inventory Turnover':'Inventory Rotation';const mainValue=kind==='turnover'?m.turnover:m.rotation;const mainDesc=kind==='turnover'?'COGS / COX ÷ Average Inventory Value.':'Units Sold ÷ Average Inventory Units.';return `<div class="grid review-grid metric-grid">${card(mainLabel,num(mainValue)+'x',mainDesc,'final hero')}${card('Units Sold',num(m.unitsSold),'Total Atletix units in the selected period.','good')}${card('Opening Inventory',num(m.opening),'Units available at the beginning of the selected period.')}${card('Ending Inventory',num(m.ending),'Opening inventory minus selected-period units.')}${card('Average Inventory Units',num(round2(m.avgUnits)),'(Opening Inventory + Ending Inventory) ÷ 2')}${card('Total COGS / COX',money(m.totalCogs),'Units Sold × Unit COGS / COX.','final')}${card('Average Inventory Value',money(m.avgValue),'Average Inventory Units × Unit COGS / COX.','final')}${card('Unit COGS / COX',money(m.unit),'Configured product cost used for this report.')}</div>`;}
function renderInventoryOverview(){const m=inventoryMetrics();let html=`<div class="notice"><b>${esc(periodLabel().split(' (')[0])}</b> · Inventory metrics are calculated from the selected period only. Rotation is unit-based; turnover is value-based.</div><div class="slbl">Inventory Overview</div><div class="grid review-grid metric-grid">${card('Inventory Rotation',num(m.rotation)+'x','Units Sold ÷ Average Inventory Units.','good')}${card('Inventory Turnover',num(m.turnover)+'x','COGS / COX ÷ Average Inventory Value.','final hero')}${card('Units Sold',num(m.unitsSold),'Units used in both inventory calculations.','good')}${card('Average Inventory Units',num(round2(m.avgUnits)),'Opening plus ending inventory divided by 2.')}${card('Total COGS / COX',money(m.totalCogs),'Units Sold × Unit COGS / COX.','final')}${card('Average Inventory Value',money(m.avgValue),'Average Inventory Units × Unit COGS / COX.','final')}</div><div class="metric-note"><b>Required fields used:</b> Opening Inventory, Ending Inventory, Units Sold, Unit COGS / COX, Total COGS / COX, and Average Inventory Value. No extra fields are included in the calculation.</div>`;document.getElementById('main').className='';document.getElementById('main').innerHTML=html;}
function renderInventoryRotation(){const m=inventoryMetrics();let html=`<div class="notice"><b>${esc(periodLabel().split(' (')[0])}</b> · Inventory Rotation is the unit-movement metric.</div><div class="slbl">Inventory Rotation</div>${metricKpis(m,'rotation')}<div class="formula-card"><b>Formula:</b> Inventory Rotation = Units Sold ÷ Average Inventory Units.<br><b>Current calculation:</b> ${num(m.unitsSold)} ÷ ${num(round2(m.avgUnits))} = ${num(m.rotation)}x.<div class="field-list"><div class="field-chip"><b>Opening Inventory</b> Units available at the start of the period.</div><div class="field-chip"><b>Ending Inventory</b> Units remaining after period movement.</div><div class="field-chip"><b>Average Inventory Units</b> (Opening Inventory + Ending Inventory) ÷ 2.</div><div class="field-chip"><b>Units Sold</b> Total Atletix units in the selected period.</div></div></div>`;document.getElementById('main').className='';document.getElementById('main').innerHTML=html;}
function renderInventoryTurnover(){const m=inventoryMetrics();let html=`<div class="notice"><b>${esc(periodLabel().split(' (')[0])}</b> · Inventory Turnover uses the standard value-based formula.</div><div class="slbl">Inventory Turnover</div>${metricKpis(m,'turnover')}<div class="formula-card"><b>Formula:</b> Inventory Turnover = COGS / COX ÷ Average Inventory Value.<br><b>Current calculation:</b> ${money(m.totalCogs)} ÷ ${money(m.avgValue)} = ${num(m.turnover)}x.<div class="field-list"><div class="field-chip"><b>COGS / COX</b> Units Sold × Unit COGS / COX.</div><div class="field-chip"><b>Opening Inventory Value</b> Opening Inventory × Unit COGS / COX: ${money(m.openingValue)}.</div><div class="field-chip"><b>Ending Inventory Value</b> Ending Inventory × Unit COGS / COX: ${money(m.endingValue)}.</div><div class="field-chip"><b>Average Inventory Value</b> (Opening Inventory Value + Ending Inventory Value) ÷ 2.</div></div></div>`;document.getElementById('main').className='';document.getElementById('main').innerHTML=html;}
function renderReview(){const c=calcReview();const label=periodLabel().split(' (')[0];let html=`<div class="notice"><b>${esc(label)}</b> · Review by category. Add manual Atletix requests for inventory reconciliation. Use Atletix Request when product COGS / COX should be removed and only shipping should apply.</div><div class="tools"><button class="btn" onclick="clearReview()">Clear Review Choices</button><button class="btn" onclick="downloadCsv()">Download CSV</button></div>`;
const loaded=(c.states.filter(([r,st])=>st.countType==='request'&&st.included&&Number(st.shipping||0)>0).map(([r,st])=>`<span class="mini-pill">${esc(r.customer)} · ${esc(r.order_id)} · ${money(st.shipping)}</span>`).join('')); if(loaded) html+=`<div class="loaded-shipping"><b>Atletix-paid shipping details loaded:</b><br>${loaded}</div>`;
html+=`<div class="slbl">${esc(label)} Totals</div><div class="grid review-grid review-compact">${card('Total Orders for Period',num(c.totalOrders),'All Atletix orders found in the selected period.','good')}${card('Total Units Sold',num(c.totalUnits),'Total units sold in the selected period.','good')}${card('Inventory Turnover',num(inventoryMetrics().turnover)+'x','COGS / COX ÷ Average Inventory Value.','final')}${card('Excluded / Atletix Request Units',num(c.excludedUnits),'Units removed from product COGS / COX.','warn')}${card('Total COGS / COX',money(c.totalCogs),'Gross product COGS before exclusions.','final')}${card('COGS Excluded',money(c.cogsExcluded),'Product COGS / COX excluded for removed or Atletix Request rows.','warn')}${card('Total Shipping Charges',money(c.shipping),'Manual shipping entered for this review.','final')}${card('Final Invoice Due',money(c.invoice),'Total COGS / COX - COGS Excluded + Shipping.','final hero')}</div><div class="summary-note"><span><b>Total Orders Excluded:</b> ${num(c.totalExcluded)}</span><span><b>Excluded Orders:</b> ${esc(c.excludedOrders.length?c.excludedOrders.join(', '):'None')}</span></div>`;
html+=manualForm();
html+=section('Regular / Commercial Orders',c.states.filter(([r,st])=>sectionType(r,st)==='regular'));
html+=section('Marketing / Seeded Orders',c.states.filter(([r,st])=>sectionType(r,st)==='marketing'));
html+=section('Atletix Requests / Shipping Only',c.states.filter(([r,st])=>sectionType(r,st)==='request'));
html+=section('Excluded Orders',c.states.filter(([r,st])=>sectionType(r,st)==='excluded'));

document.getElementById('main').className='';document.getElementById('main').innerHTML=html;}
function pill(r){let cls='reg',label='Commercial'; if(r.type==='Marketing / Seeded'){cls='mkt';label='Marketing / Seeded'} if(r.type==='Atletix Request'){cls='req';label='Atletix Request'} if(r.type==='Credit / Return'){cls='ret';label='Credit / Return'} return `<span class="pill ${cls}">${label}</span><div class="source">Source: ${esc(r.category_source||r.reason||'')}</div>`}
function section(title,arr){return `<div class="slbl">${esc(title)}<span class="badge-count">${arr.length} rows</span></div>${arr.length?table(arr):'<div class="empty">No rows in this section.</div>'}`;}
function table(arr){return `<div class="table-wrap"><table class="tbl"><thead><tr><th>Order #</th><th>Date</th><th>Customer</th><th>Product</th><th>Category</th><th class="r">Qty</th><th class="r">Net</th><th class="r">Unit COGS</th><th class="r">Original COGS</th><th>Include in Totals</th><th>How to Count</th><th>Manual Shipping</th><th>Note</th></tr></thead><tbody>${arr.map(([r,st])=>rowHtml(r,st)).join('')}</tbody></table></div>`}
function rowHtml(r,st){const k=keyOf(r),qty=Number(st.edits?.quantity??r.quantity??0),unit=Number(st.edits?.unit_cogs??r.unit_cogs??0);return `<tr><td data-label="Order #">${esc(r.order_id)}</td><td data-label="Date">${dateFmt(r.order_date)}</td><td data-label="Customer">${esc(st.edits?.customer??r.customer)}<div class="email">${esc(r.customer_email||'')}</div></td><td data-label="Product">${esc(st.edits?.product??r.product)}<div class="mini">${esc((st.edits?.variant ?? r.variant) || '')}</div></td><td data-label="Category">${pill(r)}</td><td data-label="Qty" class="r">${num(qty)}</td><td data-label="Net" class="r money">${money(r.net)}</td><td data-label="Unit COGS" class="r money">${money(unit)}</td><td data-label="Original COGS" class="r money">${money(qty*unit)}</td><td data-label="Include"><label><input type="checkbox" ${st.included?'checked':''} onchange="setRow('${k}',{included:this.checked})"> Add to totals</label><div class="mini">Uncheck to exclude from review totals.</div></td><td data-label="How to Count" class="row-actions"><button class="btn choice ${st.countType!=='request'?'active':''}" onclick="setRow('${k}',{countType:'regular',included:true})">Regular Order</button><button class="btn choice ${st.countType==='request'?'active':''}" onclick="setRow('${k}',{countType:'request',included:true})">Atletix Request</button><div class="mini">Atletix Request = product COGS / COX excluded, shipping only.</div></td><td data-label="Shipping"><input class="ship-input" value="${esc(st.shipping||0)}" onchange="setRow('${k}',{shipping:Number(this.value.replace(',','.'))||0})"></td><td data-label="Note"><input class="note-input" value="${esc(st.note||'')}" onchange="setRow('${k}',{note:this.value})"></td></tr>`}
function manualForm(){return `<div class="manual-box"><div class="slbl" style="margin-top:0">Add / Update Manual Atletix Request</div><div class="manual-grid"><input id="mCustomer" placeholder="Customer" value="Mirko Midili"><input id="mId" placeholder="Manual ID" value="MANUAL-MIRKO-H1-2026"><input id="mQty" placeholder="Qty" value="4"><input id="mUnit" placeholder="Unit COGS / COX" value="89"><input id="mShipping" placeholder="Shipping" value="17.33"><input id="mDate" placeholder="Date YYYY-MM-DD" value="2026-06-30"><textarea id="mNote" placeholder="Address / phone / notes">MIRKO MIDILI | 4412 Las Colinas Ln | Norman, OK 73072 | Phone: +1 580 559 6577</textarea><button class="btn btn-primary" onclick="addManual()">Add / Update Manual Row</button></div></div>`;}
function addManual(){const id=document.getElementById('mId').value.trim()||'MANUAL-'+Date.now();const q=Number(document.getElementById('mQty').value)||0,u=Number(document.getElementById('mUnit').value)||0;const row={manual_id:id,order_id:id,order_date:(document.getElementById('mDate').value||new Date().toISOString().slice(0,10))+'T12:00:00Z',customer:document.getElementById('mCustomer').value||'Manual Atletix Request',customer_email:'',product:'Atletix Horse',variant:'60 Doses',sku:report.config?.sku||'ATLETIX60',quantity:q,gross:0,discount:0,net:0,unit_cogs:u,cogs:q*u,type:'Atletix Request',reason:'Manual Atletix shipment not found in Shopify',category_source:'Manual review entry',manual_shipping:Number(document.getElementById('mShipping').value)||0,note:document.getElementById('mNote').value,is_manual:true};rows=rows.filter(r=>keyOf(r)!==id).concat([row]);const all=readReview();all[id]={included:true,countType:'request',shipping:row.manual_shipping,note:row.note,edits:{customer:row.customer,product:row.product,variant:row.variant,quantity:q,unit_cogs:u}};writeReview(all);buildPeriodSelect();document.getElementById('periodSelect').value=periodKeyForRow(row).half;renderReview();}
function clearReview(){if(confirm('Clear local review choices?')){localStorage.removeItem(LS_REVIEW);renderReview();}}
function renderStandard(){const list=selectedRows();const totalUnits=list.reduce((s,r)=>s+Number(r.quantity||0),0), cogs=list.reduce((s,r)=>s+Number(r.cogs||0),0), net=list.reduce((s,r)=>s+Number(r.net||0),0), gross=list.reduce((s,r)=>s+Number(r.gross||0),0), disc=list.reduce((s,r)=>s+Number(r.discount||0),0);let html=`<div class="slbl">Core KPIs</div><div class="grid">${card('Gross Sales',money(gross),'All Atletix line gross sales.')}${card('Units in Range',num(totalUnits),'Commercial + marketing + credits.')}${card('Net Sales',money(net),'Gross sales minus discounts.')}${card('Number of Orders',num(new Set(list.map(r=>r.order_id)).size),'Unique Atletix orders.')}${card('Discount',money(disc),'Total line discounts.')}${card('COGS',money(cogs),'Qty x unit cost.')}</div>`;html+=section('Commercial Sales',list.filter(r=>r.type==='Commercial').map(r=>[r,stateFor(r)]));html+=section('Marketing Activities / Seeded Units',list.filter(r=>r.type==='Marketing / Seeded').map(r=>[r,stateFor(r)]));html+=section('Atletix Requests / Shipping Only',list.filter(r=>r.type==='Atletix Request').map(r=>[r,stateFor(r)]));document.getElementById('main').className='';document.getElementById('main').innerHTML=html;document.getElementById('periodLabel').textContent=periodLabel();}
function downloadCsv(){const c=calcReview();const lines=[];lines.push(['Metric','Value']);[['Period',periodLabel()],['Generated',report.generated_at],['Total Orders for Period',c.totalOrders],['Total Orders Excluded',c.totalExcluded],['Total Units Sold',c.totalUnits],['Excluded / Atletix Request Units',c.excludedUnits],['Total COGS / COX',c.totalCogs],['COGS Excluded',c.cogsExcluded],['Net COGS / COX',c.netCogs],['Total Shipping Charges',c.shipping],['Final Invoice Due',c.invoice],['Excluded Orders',c.excludedOrders.join(' | ')]].forEach(x=>lines.push(x));lines.push([]);lines.push(['Order #','Date','Customer','Email','Product','Category','Category Source','Qty','Net','Unit COGS','Original COGS','Included','Count Type','Manual Shipping','Note']);c.states.forEach(([r,st])=>lines.push([r.order_id,dateFmt(r.order_date),st.edits?.customer??r.customer,r.customer_email,st.edits?.product??r.product,r.type,r.category_source||r.reason,st.edits?.quantity??r.quantity,r.net,st.edits?.unit_cogs??r.unit_cogs,(st.edits?.quantity??r.quantity)*(st.edits?.unit_cogs??r.unit_cogs),st.included,st.countType,st.shipping,st.note]));const csv=lines.map(a=>a.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='atletix_'+periodLabel().replace(/[^a-z0-9]+/gi,'_').toLowerCase()+'.csv';a.click();URL.revokeObjectURL(url);}
loadData();
